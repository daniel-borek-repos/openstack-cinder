# Tests live inside the package (cinder/tests). Main and test sources share the
# cinder/ root and are split with inclusion/exclusion patterns so they stay disjoint.
sonar.sources=cinder
sonar.tests=cinder
sonar.exclusions=cinder/tests/**,cinder/locale/**
sonar.test.inclusions=cinder/tests/**

# Python coverage, produced in CI by:
#     coverage combine && coverage xml -o coverage.xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11, 3.12, 3.13
